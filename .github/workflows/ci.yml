name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build todmv
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/libtodmv.dmf
          test -f build/dmf/libtodmv_version.txt
          test -f build/dmf/test_libtodmv.dmf
          test -f build/dmf/todmv.dmf
          test -f build/dmf/todmv_version.txt
          echo "Module files present"

      - name: Run libtodmv tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_libtodmv-local.dmd -y
          dmod_loader build/dmf/test_libtodmv.dmf

      - name: Assemble the example with todmv
        run: |
          # assemble -> disassemble -> assemble -> disassemble: the same text,
          # and the canonical text assembles into the same binary again
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/todmv-local.dmd -y
          dmod_loader build/dmf/todmv.dmf --args examples/demo.dmvs -o build/demo.dmv
          test -s build/demo.dmv
          dmod_loader build/dmf/todmv.dmf --args -d build/demo.dmv -o build/demo-1.dmvs
          dmod_loader build/dmf/todmv.dmf --args build/demo-1.dmvs -o build/demo-1.dmv
          dmod_loader build/dmf/todmv.dmf --args -d build/demo-1.dmv -o build/demo-2.dmvs
          dmod_loader build/dmf/todmv.dmf --args build/demo-2.dmvs -o build/demo-2.dmv
          cmp build/demo-1.dmvs build/demo-2.dmvs
          cmp build/demo-1.dmv build/demo-2.dmv
